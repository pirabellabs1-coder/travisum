<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu du logo Travisum</title>
<style>
  body { margin:0; font-family: Inter, Arial, sans-serif; background:#FBF9FB; color:#00050E; }
  .bande { padding: 28px 40px; border-bottom: 1px solid #E7BF9755; }
  .sombre { background:#00050E; color:#FBF9FB; }
  h2 { font-size: 12px; letter-spacing:.18em; text-transform:uppercase; margin:0 0 16px;
       color:#5D4123; font-weight:600; }
  .sombre h2 { color:#E7BF97; }
  .rangee { display:flex; align-items:center; gap:36px; flex-wrap:wrap; }
  .etiq { font-size:11px; color:#74777D; letter-spacing:.1em; text-transform:uppercase; }
  figure { margin:0; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
</style>
</head>
<body>

<div class="bande">
  <h2>Logotype horizontal — sur ivoire</h2>
  <img src="../assets/img/logo-travisum.svg" width="560" alt="Logo Travisum">
</div>

<div class="bande sombre">
  <h2>Logotype horizontal — sur encre</h2>
  <img src="../assets/img/logo-travisum.svg" width="560" alt="Logo Travisum sur fond sombre">
  <p style="font-size:13px;color:#B5C8E3;margin:14px 0 0">
    Le logotype est en bleu-violet : sur fond encre il perd son contraste.
    C'est la marque seule qui doit être utilisée dans le pied de page.
  </p>
</div>

<div class="bande">
  <h2>Marque seule — tailles réelles d'usage</h2>
  <div class="rangee">
    <figure><img src="../assets/img/logo-mark.svg" width="128" alt=""><span class="etiq">128 px</span></figure>
    <figure><img src="../assets/img/logo-mark.svg" width="64" alt=""><span class="etiq">64 px</span></figure>
    <figure><img src="../assets/img/logo-mark.svg" width="48" alt=""><span class="etiq">48 px — en-tête</span></figure>
    <figure><img src="../assets/img/logo-mark.svg" width="32" alt=""><span class="etiq">32 px — favicon</span></figure>
    <figure><img src="../assets/img/logo-mark.svg" width="16" alt=""><span class="etiq">16 px — onglet</span></figure>
  </div>
</div>

<div class="bande sombre">
  <h2>Marque sur encre — pied de page et menu mobile</h2>
  <div class="rangee">
    <figure><img src="../assets/img/logo-mark-sombre.svg" width="128" alt=""><span class="etiq" style="color:#B5C8E3">128 px</span></figure>
    <figure><img src="../assets/img/logo-mark-sombre.svg" width="48" alt=""><span class="etiq" style="color:#B5C8E3">48 px</span></figure>
    <figure><img src="../assets/img/logo-mark-sombre.svg" width="32" alt=""><span class="etiq" style="color:#B5C8E3">32 px</span></figure>
  </div>
</div>

</body>
</html>
